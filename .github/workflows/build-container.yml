# .github/workflows/build-container.yml
name: Build Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

env:
  IMAGE: ghcr.io/smelicit1-debug/claw-in-the-tank

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/integration/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CITB_VERSION=${{ steps.meta.outputs.version }}

      - name: Verify image
        run: |
          docker pull "${{ env.IMAGE }}:latest"
          echo "✅ Container built and pushed: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

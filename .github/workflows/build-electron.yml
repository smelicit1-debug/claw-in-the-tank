# .github/workflows/build-electron.yml
name: Build Electron

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os:
          - { runner: windows-latest,  target: win,  suffix: .exe }
          - { runner: macos-latest,    target: mac,  suffix: .dmg }
    runs-on: ${{ matrix.os.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: packages/electron
        run: pnpm install

      - name: Build
        working-directory: packages/electron
        run: pnpm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-in-the-tank-${{ matrix.os.target }}
          path: packages/electron/dist/*
          if-no-files-found: warn

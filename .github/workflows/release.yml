# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-container:
    name: Build Container
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-electron:
    name: Build Desktop Apps
    uses: ./.github/workflows/build-electron.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [build-container, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-in-the-tank-win
          path: release-artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-in-the-tank-mac
          path: release-artifacts/macos

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          VERSION_BARE="${VERSION#v}"
          awk "/^## \\[${VERSION_BARE}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md \
            > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "::warning::CHANGELOG.md has no entry for [${VERSION_BARE}] — creating release with default body."
            echo "Initial release of Claw in the Tank v${VERSION_BARE}" > /tmp/release_notes.md
          fi
          echo "notes_path=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/windows/*
            release-artifacts/macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

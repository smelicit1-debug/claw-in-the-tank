appId: com.openclawtank.tank.desktop
productName: Claw in the Tank
executableName: FoxInTheBox
copyright: "Copyright © 2024 Vulpy, Inc."

npmRebuild: false

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - package.json

icon: assets/icon.png

win:
  icon: assets/icon.ico
  publisherName: Vulpy, Inc.
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "claw-in-the-tank-setup-${arch}.exe"
  signAndEditExecutable: false

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Claw in the Tank
  shortcutName: Claw in the Tank
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  include: build/installer.nsh

mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: "claw-in-the-tank-${arch}-mac.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: Z6J8AVT9QK

linux:
  category: Utility
  executableName: claw-in-the-tank
  target:
    - dir

publish:
  provider: github
  owner: claw-in-the-tank-ai
  repo: claw-in-the-tank
  releaseType: release
